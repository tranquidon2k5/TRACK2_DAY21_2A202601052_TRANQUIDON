name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần cloud storage)
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: unit-test         # Chỉ chạy khi job unit-test qua
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          python -c "import os, json; creds=json.loads(os.environ['STORAGE_CREDENTIALS']); print(f'AWS_ACCESS_KEY_ID={creds[\"aws_access_key_id\"]}\nAWS_SECRET_ACCESS_KEY={creds[\"aws_secret_access_key\"]}')" >> $GITHUB_ENV
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          print(f"Uploaded models/model.joblib to s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép triển khai khi f1_score >= 0.65
  quality-gate:
    name: Quality Gate
    needs: train             # Chỉ chạy khi job train qua
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys
          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"Evaluated F1 score: {f1:.4f}")
          if f1 < 0.65:
              print(f"Quality gate failed: F1 {f1:.4f} < 0.65")
              sys.exit(1)
          print("Quality gate passed!")
          PYEOF

  # JOB 4: Triển khai sau khi quality gate qua
  release:
    name: Release
    needs: quality-gate      # Chỉ chạy khi job quality-gate qua
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -f http://localhost:8080/healthz || exit 1
